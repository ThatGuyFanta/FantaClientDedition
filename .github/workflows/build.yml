
name: FantaClient Demon Edition

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fantaclient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FantaClient
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: FantaClient

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify Project
        run: |
          echo "Checking FantaClient..."
          ls -la
          test -f build.gradle
          test -f settings.gradle
          test -d src/main

      - name: Build FantaClient
        run: gradle clean build --no-daemon

      - name: Show Generated JARs
        run: |
          find build/libs -maxdepth 1 -type f -name "*.jar"
          test -n "$(find build/libs -maxdepth 1 -name "*.jar" -print -quit)"

      - name: Upload ALL JAR Files
        uses: actions/upload-artifact@v4
        with:
          name: FantaClient-Demon-Edition-1.21.11
          path: FantaClient/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
